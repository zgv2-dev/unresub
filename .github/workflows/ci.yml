name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      - name: Build web app and sync into Android project
        working-directory: packages/mobile
        env:
          # Repo variable: https URL of your UnReSub server, e.g. https://unresub.example.com
          VITE_API_BASE: ${{ vars.UNRESUB_API_URL }}
        run: pnpm sync

      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build APKs
        working-directory: packages/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: unresub-debug-${{ env.VERSION_NAME }}
          path: packages/mobile/android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: unresub-release-${{ env.VERSION_NAME }}
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk

  # Publishes the web UI (packages/web) to Vercel as a static site. The API server
  # (SQLite + background sync) is not serverless-friendly and runs elsewhere;
  # the UI calls it at vars.UNRESUB_API_URL.
  vercel:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_API_BASE: ${{ vars.UNRESUB_API_URL }}
    steps:
      - name: Check Vercel setup
        run: |
          missing=()
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!name}" ] || missing+=("secret $name")
          done
          [ -n "$VITE_API_BASE" ] || missing+=("variable UNRESUB_API_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Missing repo %s (see README, "Web on Vercel")\n' "${missing[@]}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npm install --global vercel@66

      # Fails fast on a bad or expired token, and on wrong org/project ids.
      - name: Verify Vercel auth
        run: |
          vercel whoami --token "$VERCEL_TOKEN"
          vercel project inspect --token "$VERCEL_TOKEN"

      - name: Build web app
        run: pnpm --filter @unresub/web build

      # Prebuilt output (Build Output API v3), so Vercel project build settings don't matter.
      - name: Package for Vercel
        run: |
          mkdir -p .vercel/output/static
          cp -r packages/web/dist/. .vercel/output/static/
          echo '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}' > .vercel/output/config.json

      - name: Deploy to production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
