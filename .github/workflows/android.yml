name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      - name: Build web app and sync into Android project
        working-directory: packages/mobile
        env:
          # Repo variable: https URL of your UnReSub server, e.g. https://unresub.example.com
          VITE_API_BASE: ${{ vars.UNRESUB_API_URL }}
        run: pnpm sync

      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build APKs
        working-directory: packages/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: unresub-debug-${{ env.VERSION_NAME }}
          path: packages/mobile/android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: unresub-release-${{ env.VERSION_NAME }}
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk
